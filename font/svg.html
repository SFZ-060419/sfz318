<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG图标</title>
    <script src="./iconfont.js"></script>
    <link rel="stylesheet" href="./css/svg.css">
</head>
<body>
    <h3>SVG图标</h3>
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-xz"></use>
        </svg>
            <span>收藏</span>
            <div class="budge-dot" id="budge-home"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-24px"></use>
        </svg>
            <span>转发</span>
            <div class="budge-num" id="budge-plan">6</div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-fenxiang"></use>
        </svg>
            <span>分享</span>
            <div class="budge-dot" id="budge-home"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
        <svg class="icon" aria-hidden="true">
            <use xlink:href="#icon-gouwuche"></use>
        </svg>
            <span>购物车</span>
            <div class="budge-num max" id="budge-my">100+</div>
        </div>
    </div>
    <script>
        
     //写一个函数，当我点击当前的item的时候，颜色发生变化
    function changeTab(current){
        let tabs = document.querySelectorAll(".tab-item");
        for(let i = 0;i < tabs.length;i++){
            tabs[i].classList.remove("active");
        }
        current.classList.add("active");
    }
    </script>
</body>
</html>
