<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS对象的应用</title>
</head>
<body>
    <!--个人明信片的案例：明信片中包含属性和方法，贴近大学生生活-->
    <script>
        var studentCard = {
            name: "张三",
            age: 20,
            sex: "男",
            school: "某某大学",
            major: "计算机科学与技术",
            hobby: ["编程", "篮球", "旅行"],
            grade: "大三",
            //方法     反引号`可以嵌入表达式，this指向当前对象，$()这个$就是要嵌入的变量()
            // 可以用return返回值
            introduce: function() {
                return(`你好，我是${this.name}，我今年${this.age}岁，来自${this.school}，我的专业是${this.major}。我的爱好包括${this.hobby.join("、")}。`);
            },
            upgrade: function(){
              const grades = ["大一", "大二", "大三", "大四"];
              //变量的提升，提升的是变量的声明，变量的赋值不会提升
              //let声名的变量不会提升
              const index=grades.indexOf(this.grade);
              //let是块级作用域，i只在当前块级作用域有效，
              //var的作业域如果定义在最前面是全局变量，如果定义在函数内，是函数作用域，函数外部无法访问
              for(let i=index; i < grades.length; i++){
                this.grade = grades[i];
                console.log(`升级成功,当前年级为:${this.grade}`);
                if(index<grades.length-1){
                  this.grade =grades[index + 1];
                }else {
                    this.grade ="毕业";
                }
              };  
            return this.grade;
            

        },
    }
    </script>
</body>
</html>
