<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实践的冒泡与捕获</title>
    <style>
        .box{
            width:400px;
            height:400px;
            background-color: red;
        }
        #h2{
            width:400px;
            height:400px;
            background-color: blue;
        }
        #em{
            width:400px;
            height:400px;
            background-color: yellow;

        }
    </style>
    <!--冒泡：事件会从最里层开始，逐层向上传播，直到document对象 
    ——冒泡是从子元素到父元素依次触发-->
</head>
<body>
    <button id="myButton"onclick="clickFun()">点击事件</button>
    <div class="box">
        <h2>是冒泡还是<em id="em">捕获</em></h2>
    </div>
    <input type="text" id="input" placeholder="请输入内容">
    <script>
        function clickFun(){
            alert("点击事件触发");
        
        //var box=document.getElementsByClassName(".box");
        box.addEventListener("click",function(){
            alert("box");
        },false);//false表示冒泡，true表示捕获
        var h2=document.getElementById("h2");
        h2.addEventListener("click",function(){
            alert("h2");
        },false);
        var em=document.getElementById("em");
        em.addEventListener("click",function(){
            alert("em");
        },false);
    }
    </script>

</body>
</html>
